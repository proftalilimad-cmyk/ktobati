# Netlify configuration — SPA (Vite/React Router)
[build]
  command = "npm run build"
  publish = "dist"

# Client-side routing: serve index.html for every route
# (needed for /admin, /dashboard, /livre/:slug, etc.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-cache hashed assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
