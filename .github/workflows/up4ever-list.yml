name: up4ever-list

# Fetches the authenticated Up-4ever account file list using the
# UP4EVER_API_KEY Actions secret (server-side secret only; never in code,
# never in URLs, never printed). Output artifact: up4ever-files.json.
on:
  workflow_dispatch:
  push:
    branches:
      - arena/4aa5d7de-ktobati
    paths:
      - scripts/.up4ever-trigger

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch account files (Up-4ever API)
        env:
          UP4EVER_API_KEY: ${{ secrets.UP4EVER_API_KEY }}
        run: |
          set +e
          node scripts/up4ever-export.mjs > out.txt 2> err.txt
          code=$?
          echo "--- stdout ---"; cat out.txt
          echo "--- stderr ---"; cat err.txt
          {
            echo '### up4ever export output'
            echo '```'
            cat out.txt
            echo '--- stderr ---'
            cat err.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Upload export logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-logs
          path: |
            out.txt
            err.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Push export outputs to repo (readable from sandbox)
        if: always()
        run: |
          git config user.name "up4ever-bridge"
          git config user.email "up4ever-bridge@users.noreply.github.com"
          mkdir -p .diag
          cp out.txt err.txt up4ever-files.json .diag/ 2>/dev/null || true
          git add -f .diag
          git commit -m "bridge(run ${{ github.run_id }}): export outputs" --allow-empty
          git push origin HEAD:refs/heads/arena/4aa5d7de-ktobati

      - name: Job summary
        run: |
          node -e "
            const d = JSON.parse(require('fs').readFileSync('up4ever-files.json', 'utf8'));
            const lines = ['# Up-4ever account files', '', '| # | name | size | folder |', '|---|---|---|---|'];
            d.items.forEach((f, i) => lines.push('| ' + [i + 1, String(f.name).replace(/\|/g, '\\|'), f.size ?? '', String(f.folder ?? '')].join(' | ') + ' |'));
            require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          "

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: up4ever-files
          path: up4ever-files.json
          if-no-files-found: error
          retention-days: 30
